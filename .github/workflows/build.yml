name: Build unsigned IPA

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls /Applications | grep -i xcode || true
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then echo "Selecting $XC"; sudo xcode-select -s "$XC"; fi
          xcodebuild -version
          swift --version

      - name: Trust SPM macros/plugins
        run: |
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES

      - name: Generate project with XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (no signing)
        run: |
          xcodebuild -project EmbyPlayer.xcodeproj -scheme EmbyPlayer \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          APP=$(find build/DD/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry EmbyPlayer-unsigned.ipa Payload
          ls -lh EmbyPlayer-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EmbyPlayer-unsigned-ipa
          path: EmbyPlayer-unsigned.ipa
          retention-days: 30

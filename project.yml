name: EmbyPlayer
options:
  bundleIdPrefix: com.denia
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  MPVUI:
    url: https://github.com/LePips/MPVUI
    exactVersion: 0.10.0
targets:
  EmbyPlayer:
    type: application
    platform: iOS
    sources:
      - path: EmbyPlayer
      - path: EmbyPlayer/Fonts/NotoSansCJKsc-Regular.otf
        buildPhase: resources
      - path: EmbyPlayer/Shaders/Anime4K_Clamp_Highlights.glsl
        buildPhase: resources
      - path: EmbyPlayer/Shaders/Anime4K_Restore_CNN_M.glsl
        buildPhase: resources
      - path: EmbyPlayer/Shaders/Anime4K_Upscale_CNN_x2_M.glsl
        buildPhase: resources
      - path: EmbyPlayer/Shaders/Anime4K_AutoDownscalePre_x2.glsl
        buildPhase: resources
      - path: EmbyPlayer/Shaders/Anime4K_AutoDownscalePre_x4.glsl
        buildPhase: resources
      - path: EmbyPlayer/Shaders/Anime4K_Upscale_CNN_x2_S.glsl
        buildPhase: resources
      - path: EmbyPlayer/Shaders/FSRCNNX_x2_8-0-4-1.glsl
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: false
        NSFaceIDUsageDescription: 用于验证身份并解锁 Denia Player。
        CFBundleDisplayName: Denia Player
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.denia.embyplayer2
        MARKETING_VERSION: "1.77"
        CURRENT_PROJECT_VERSION: "178"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_STYLE: Automatic
    dependencies:
      - package: MPVUI
        product: MPVUI
      - framework: Frameworks/MobileVLCKit.xcframework
        embed: true

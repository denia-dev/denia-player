name: EmbyPlayer
options:
  bundleIdPrefix: com.denia
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  MPVUI:
    url: https://github.com/LePips/MPVUI
    exactVersion: 0.10.0
targets:
  EmbyPlayer:
    type: application
    platform: iOS
    sources:
      - path: EmbyPlayer
      - path: EmbyPlayer/Fonts/NotoSansCJKsc-Regular.otf
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [deniaplayer]
        NSFaceIDUsageDescription: 用于验证身份并解锁 Denia Player。
        CFBundleDisplayName: Denia Player
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.denia.embyplayer
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "70"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_STYLE: Automatic
    dependencies:
      - package: MPVUI
        product: MPVUI
      - framework: Frameworks/MobileVLCKit.xcframework
        embed: true
      - target: DownloadActivityWidget

  DownloadActivityWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: DownloadActivityWidget
      - path: EmbyPlayer/DownloadActivityAttributes.swift
    info:
      path: DownloadActivityWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).DownloadWidgets"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.denia.embyplayer.DownloadActivityWidget
        IPHONEOS_DEPLOYMENT_TARGET: "16.1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
